configuration:
  cluster:
    # Set your cluster name to report to SentinelOne console
    name: "poc-cluster"

  # Use Harbor registry images
  repositories:
    agent: "harbor.poc.mdplabs.dev/sentinelone/s1agent"
    helper: "harbor.poc.mdplabs.dev/sentinelone/s1helper"

  tag:
    agent: "26.2.1-x86_64"
    helper: "26.2.1-x86_64"

  imagePullPolicy: "IfNotPresent"

secrets:
  # Image pull secret name (will be created by external-secret)
  imagePullSecret: "sentinelone-docker-secret"

  # Site key (will be populated by external-secret)
  site_key:
    name: "sentinelone-secret"

# Additional configurations
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
