apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdp-website
spec:
  replicas: 1
  # Media lives on a ReadWriteOnce PVC; Recreate avoids two pods contending
  # for the volume during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mdp-website
  template:
    metadata:
      labels:
        app: mdp-website
    spec:
      # Matches the non-root uid/gid baked into the image (nextjs 1001);
      # fsGroup makes the mounted media PVC writable by that user.
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      # Apply committed Payload migrations to the real database BEFORE the app
      # starts. `payload migrate` is idempotent (it records applied migrations
      # in the payload_migrations table and skips them next time), so this is a
      # no-op on unchanged deploys and applies only new migrations otherwise.
      # If it fails, the app container never starts — we never serve against an
      # un-migrated schema. Uses the same image + env as the app container; the
      # kustomize images: transformer rewrites `placeholder/mdp-website` here too.
      initContainers:
        - name: migrate
          image: placeholder/mdp-website:latest
          command: ["pnpm", "payload", "migrate"]
          envFrom:
            - configMapRef:
                name: mdp-website-env
            - secretRef:
                name: mdp-website-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      containers:
        - name: mdp-website
          image: placeholder/mdp-website:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: mdp-website-env
            - secretRef:
                name: mdp-website-secret
          volumeMounts:
            - name: media
              mountPath: /data/media
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: mdp-website-media
