apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdp-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mdp-website
  template:
    metadata:
      labels:
        app: mdp-website
    spec:
      containers:
        - name: mdp-website
          image: placeholder/mdp-website:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: mdp-website-env
            - secretRef:
                name: mdp-website-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
