apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mdp-website
  namespace: argocd
  labels:
    env: dev
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
     - CreateNamespace=true
  destination:
    namespace: mdp-website-dev
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/mdp-eg-org/infra-mdp
    targetRevision: HEAD
    path: apps/mdp-website/overlay/dev
---
