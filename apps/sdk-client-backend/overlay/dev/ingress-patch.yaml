apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sdk-client-backend-ingress
  annotations:
    cert-manager.io/cluster-issuer: acme-issuer
spec:
  ingressClassName: traefik-external
  rules:
    - host: sdk-client-backend-dev.poc.mdplabs.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sdk-client-backend
                port:
                  number: 4000
  tls:
    - hosts:
        - sdk-client-backend-dev.poc.mdplabs.dev
      secretName: sdk-client-backend-tls


