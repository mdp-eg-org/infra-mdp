apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sdk-client-backend-secret
  annotations:
    argocd.argoproj.io/hook: PreSync
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: sdk-client-backend-secret
  dataFrom:
    - extract:
        key: dev/sdk-client-backend
